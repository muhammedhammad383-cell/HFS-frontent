<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Royal Emerald Background Gradient -->
    <radialGradient id="emeraldBg" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#0F5243"/>
      <stop offset="60%" stop-color="#07362C"/>
      <stop offset="100%" stop-color="#031F19"/>
    </radialGradient>

    <!-- Metallic Champagne Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E498"/>
      <stop offset="30%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#FFF3B0"/>
      <stop offset="75%" stop-color="#AA7C11"/>
      <stop offset="100%" stop-color="#E6C665"/>
    </linearGradient>

    <filter id="luxShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Outer Gold Rim -->
  <circle cx="256" cy="256" r="246" fill="url(#goldGrad)" filter="url(#luxShadow)"/>
  
  <!-- Main Emerald Luxury Circle -->
  <circle cx="256" cy="256" r="232" fill="url(#emeraldBg)"/>
  
  <!-- Inner Fine Gold Accent Ring -->
  <circle cx="256" cy="256" r="212" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-dasharray="12 6" opacity="0.85"/>
  <circle cx="256" cy="256" r="202" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.5"/>

  <!-- Top Golden Hanger / Roof Crest Icon (Symbolizing Wardrobe & Home Living) -->
  <g filter="url(#luxShadow)">
    <!-- Hook -->
    <path d="M 256 95 C 256 72, 282 72, 282 90 C 282 103, 256 108, 256 122" fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round"/>
    <!-- Elegant Hanger/Roof Arch -->
    <path d="M 140 165 L 256 120 L 372 165" fill="none" stroke="url(#goldGrad)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Center Diamond Star -->
    <polygon points="256,138 264,150 256,162 248,150" fill="url(#goldGrad)"/>
  </g>

  <!-- Bold Luxury HFS Monogram -->
  <g filter="url(#luxShadow)">
    <text x="256" y="310" font-family="Georgia, 'Times New Roman', serif" font-size="148" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">HFS</text>
  </g>

  <!-- Bottom Golden Ornamental Divider & BAZAAR -->
  <path d="M 135 342 L 377 342" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="256" cy="342" r="6" fill="url(#goldGrad)"/>

  <text x="256" y="388" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="#F9E498" text-anchor="middle" letter-spacing="14">BAZAAR</text>
</svg>