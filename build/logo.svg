<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- White Circular Base -->
  <circle cx="256" cy="256" r="240" fill="#ffffff" filter="url(#dropShadow)"/>

  <!-- 4-Color Outer Ring (Google/Custom Palette: Red, Yellow, Green, Blue) -->
  <!-- Top Red Arc -->
  <path d="M 99 99 A 222 222 0 0 1 413 99" fill="none" stroke="#EA4335" stroke-width="28" stroke-linecap="round"/>
  <!-- Right Yellow Arc -->
  <path d="M 413 99 A 222 222 0 0 1 413 413" fill="none" stroke="#FBBC05" stroke-width="28" stroke-linecap="round"/>
  <!-- Bottom Green Arc -->
  <path d="M 413 413 A 222 222 0 0 1 99 413" fill="none" stroke="#34A853" stroke-width="28" stroke-linecap="round"/>
  <!-- Left Blue Arc -->
  <path d="M 99 413 A 222 222 0 0 1 99 99" fill="none" stroke="#4285F4" stroke-width="28" stroke-linecap="round"/>

  <!-- Stylized Green HFS Monogram & Text -->
  <g filter="url(#dropShadow)">
    <!-- Stylized HFS Script/Monogram -->
    <text x="256" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="145" font-weight="900" font-style="italic" fill="#2E9B3C" text-anchor="middle" letter-spacing="-4">HFS</text>
    
    <!-- BAZAAR Subtext -->
    <text x="256" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#1E7E34" text-anchor="middle" letter-spacing="6">BAZAAR</text>
  </g>

  <!-- Double Swoosh Underline (Yellow & Blue) -->
  <path d="M 140 370 Q 260 335 405 320" fill="none" stroke="#FBBC05" stroke-width="16" stroke-linecap="round" filter="url(#dropShadow)"/>
  <path d="M 165 398 Q 275 365 390 350" fill="none" stroke="#4285F4" stroke-width="14" stroke-linecap="round" filter="url(#dropShadow)"/>
</svg>