<!DOCTYPE html>
<html lang="en">
  <head>
<script>
window.addEventListener("error", function(e) {
  var d = document.createElement("div");
  d.style = "position:fixed;top:0;left:0;width:100%;z-index:999999;background:red;color:white;padding:20px;font-family:monospace;white-space:pre-wrap;word-break:break-all;";
  d.innerText = "CRASH ERROR: " + e.message + "\n\nFile: " + e.filename + "\nLine: " + e.lineno + ":" + e.colno + "\n\nStack:\n" + (e.error ? e.error.stack : "");
  document.body.appendChild(d);
});
</script>
